# ig-car-autopost configuration
#
# Secrets do NOT live here. They come from GitHub Actions secrets:
#   IG_USER_ID, IG_ACCESS_TOKEN, FB_APP_ID, FB_APP_SECRET

# ---------------------------------------------------------------------------
# KILL SWITCH. Set to false to stop all publishing without touching workflows.
# ---------------------------------------------------------------------------
enabled: true

# ---------------------------------------------------------------------------
# Hashtag sourcing
#
# HARD META LIMIT: 30 unique hashtags per rolling 7-day window, per app.
# Every new tag you resolve burns one slot. Ids are cached forever in
# state/hashtag_ids.json, but the *query* still counts, so keep this list at
# or under 30 and change it rarely. Adding a 31st tag mid-week = API errors.
#
# recent_media only returns posts from the last 24 hours.
# ---------------------------------------------------------------------------
hashtags:
  # Broad nets -- always return volume, cover the whole 70s-90s range.
  # Deliberately dropped near-duplicates (jdmlifestyle, jdmgram, 90sjdm,
  # retrojdm, r32skyline, mk4supra, jza80) to make room for the 70s/80s
  # classics without breaching the 30-tag cap. The broad tags below already
  # surface most of what those would have.
  - jdm
  - jdmculture
  - 90scars
  - japanesecars
  - datsun
  - oldschooljdm
  - classicjdm
  - shakotan
  # Nissan / Datsun -- R32 through the Z and 510 lineage
  - r32
  - nissanskyline
  - gtr32
  - hakosuka
  - datsun510
  - 240z
  - datsun240z
  - 280z
  - 300zx
  - s13
  - silvia
  # Honda
  - hondacivic
  - ek9
  - nsx
  - s2000
  # Toyota
  - supra
  - ae86
  - celica
  - mr2
  # Mazda / rotary
  - rx7
  - rx3

# How many tags to query per discover run. Rotates through the list so every
# tag gets covered over the course of a day without hammering any one of them.
tags_per_run: 5

# Prefer top_media (not limited to 24h, higher quality) over recent_media.
# recent_media is used as a fallback when top_media is thin.
use_top_media: true

# ---------------------------------------------------------------------------
# Candidate filtering
# ---------------------------------------------------------------------------
filters:
  # IMAGE only. Video/Reels publishing needs a different upload flow, and
  # CAROUSEL_ALBUM does not return a media_url at all.
  allowed_media_types:
    - IMAGE
  min_like_count: 500
  min_comments_count: 5
  # Skip captions containing these (spam, dealers, giveaways, competitors).
  caption_denylist:
    - dm to buy
    - link in bio to buy
    - giveaway
    - follow for follow
    - f4f
    - cheap
    - crypto
    - forex
    - onlyfans
    - promo code
    - discount code
  # Skip posts whose caption has more than this many hashtags (spam signal).
  max_caption_hashtags: 30

# ---------------------------------------------------------------------------
# Captions
# ---------------------------------------------------------------------------
caption:
  # ---------------------------------------------------------------------------
  # How the caption body is built. Three modes:
  #
  #   source    Reuse the original poster's description, then append your own
  #             signature block below. FREE, no API key, and it keeps the
  #             creator's own words about their car -- which is usually better
  #             than anything generated. RECOMMENDED.
  #   template  Rotating canned openers from the `openers:` list. Free.
  #   ai        Vision model looks at the photo and writes about the actual car.
  #             Best quality, but the Claude API is NOT free (~$0.004-$0.02 per
  #             post). Configure under `ai_caption:` below.
  #
  # source mode falls back to template automatically when the original post
  # had no usable description.
  # ---------------------------------------------------------------------------
  mode: source

  # Your own block, appended after the original description. This is the part
  # that is yours -- the account voice, the CTA, the ask. Keep it short; it
  # rides on every single post.
  signature: |
    Follow for daily 70s-90s JDM.
    DM for credit or removal.

  # Cap on how much of the original description to carry over. Long captions
  # get truncated at a sentence boundary where possible.
  max_source_chars: 600

  # Strip these from the original description before reusing it: the original
  # poster's hashtag block, their @mentions of unrelated accounts, and URLs.
  # Their self-credit @handle is preserved separately as the credit line.
  strip_source_hashtags: true
  strip_source_urls: true

  # Best-effort attribution. Hashtag search does NOT return the author's
  # username, so the only handle we can recover is one the creator typed into
  # their own caption. When found, it goes here. When not found, the credit
  # line is omitted entirely.
  credit_template: "\U0001F4F8 {handle}"
  # Used when no handle could be extracted from the source caption.
  credit_fallback: ""
  # Appended to every post. Keep total hashtags <= 30 (Instagram's cap).
  # These are the tags on YOUR post -- separate from the `hashtags:` list
  # above, which is what gets SEARCHED. No 30/7d limit applies here.
  hashtags:
    - jdm
    - jdmculture
    - 90scars
    - japanesecars
    - nissan
    - honda
    - toyota
    - skyline
    - r32
    - supra
    - rx7
    - carsofinstagram
  # Rotating opener lines, picked deterministically per post.
  openers:
    - "90s Japan got it right."
    - "Peak JDM era."
    - "RB or 2J?"
    - "Golden era hardware."
    - "This aged better than anything modern."
    - "Would you daily this?"
    - "Straight out of the Bubble era."
    - "Nothing since has felt like this."
    - "Analog and better for it."
    - "Sound on for this one."
  max_length: 2200

# ---------------------------------------------------------------------------
# AI captions (only used when caption.mode is "ai")
#
# COST WARNING: the Claude API has no free tier.
#   provider: claude + claude-opus-5    -> ~$0.02  per post (~$3.60/mo at 6/day)
#   provider: claude + claude-haiku-4-5 -> ~$0.004 per post (~$0.70/mo at 6/day)
#   provider: github                    -> FREE, rate-limited, uses GITHUB_TOKEN
#   provider: none                      -> no AI at all
#
# Needs ANTHROPIC_API_KEY as a repo secret for the claude provider.
# ---------------------------------------------------------------------------
ai_caption:
  enabled: false
  provider: github        # claude | github | none
  model: openai/gpt-4o    # claude-opus-5 / claude-haiku-4-5 for provider: claude
  max_caption_chars: 200
  # Append hashtags derived from the car the model identifies (e.g. #fd3s on an
  # RX-7), so tags are accurate per post instead of identical every time.
  add_model_tags: true
  # Skip publishing if the vision model says the image is not primarily a car.
  skip_if_not_car: true

# ---------------------------------------------------------------------------
# Publishing cadence
# ---------------------------------------------------------------------------
publish:
  # Posts per publish run. Meta allows 100/24h; staying well under keeps the
  # account looking human and leaves headroom.
  posts_per_run: 1
  # Refuse to publish if this many posts already went out in the rolling 24h.
  daily_cap: 6
  # Minimum minutes between two published posts.
  min_gap_minutes: 90
  # Seconds to wait for a container to reach FINISHED.
  container_timeout: 300
