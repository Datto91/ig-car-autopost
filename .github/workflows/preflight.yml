name: preflight

# Read-only credential check. Publishes nothing, queues nothing, writes nothing.
#
# Run this first, before trusting the discover/publish crons. It verifies the
# token shape, validity, expiry, account access, hashtag search, media fetch,
# and publishing quota -- in that order, so the first failure is the real cause.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Preflight (read-only)
        env:
          # Accepts either spelling of the token secret.
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN || secrets.IG_TOKEN_ACCESS }}
          FB_APP_ID: ${{ secrets.FB_APP_ID }}
          FB_APP_SECRET: ${{ secrets.FB_APP_SECRET }}
        run: python -m src.preflight
