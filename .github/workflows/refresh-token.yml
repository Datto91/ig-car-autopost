name: refresh-token

# Rotate the long-lived Facebook access token.
#
# Long-lived User tokens last ~60 days. Without this job the whole bot dies
# quietly two months after setup. Runs weekly, well inside the window, so a
# couple of consecutive failures still leave time to react.
#
# Requires a GH_PAT secret (fine-grained PAT, this repo, Secrets: read+write)
# so the job can write the refreshed token back into IG_ACCESS_TOKEN.

on:
  schedule:
    - cron: "30 4 * * 1"  # Mondays
  workflow_dispatch:
    inputs:
      check_only:
        description: "Only report expiry, do not rotate"
        type: boolean
        required: false
        default: false

permissions:
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Refresh token
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          FB_APP_ID: ${{ secrets.FB_APP_ID }}
          FB_APP_SECRET: ${{ secrets.FB_APP_SECRET }}
          GH_PAT: ${{ secrets.GH_PAT }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          python -m src.refresh_token \
            ${{ github.event.inputs.check_only == 'true' && '--check-only' || '' }}
